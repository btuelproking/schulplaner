<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6FED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SchulPlaner">
<title>SchulPlaner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#FFFFFF; --sidebar:#F5F5F7; --sidebar-hover:#EAEAEE; --sidebar-active:#E4EAF9;
  --border:#E2E2E6; --card:#FFFFFF; --soft:#FAFAFB; --text:#1E1F24; --muted:#8A8A92;
  --accent:#2F6FED; --today:#EAF0FE; --danger:#D93A3F; --done:#3E9C5C; --warn:#DE8A11;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}

/* ---------- Grundlayout ---------- */
#app{display:flex;height:100%;min-height:100vh}
#sidebar{
  width:212px;flex:0 0 212px;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;
  padding-top:calc(20px + env(safe-area-inset-top));
}
.marke{font-size:19px;font-weight:700;padding:0 8px}
.marke-datum{font-size:11px;color:var(--muted);padding:2px 8px 0}
#content{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.seite{max-width:1000px;padding:26px 30px 60px}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--border);background:#fff;color:var(--text);
  padding:9px 14px;border-radius:var(--radius);font-weight:600;font-size:14px;
}
.btn:active{background:var(--sidebar-hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-danger{color:var(--danger);border-color:#F2C9CA}
.btn-block{display:block;width:100%}
.btn-klein{padding:6px 10px;font-size:13px;border-radius:8px}

/* ---------- Navigation ---------- */
#nav{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--text);
  text-align:left;padding:11px 12px;border-radius:var(--radius);font-size:14.5px;width:100%;
}
.nav-item:active{background:var(--sidebar-hover)}
.nav-item.aktiv{background:var(--sidebar-active);color:var(--accent);font-weight:700}
.nav-item svg{width:18px;height:18px;flex:0 0 18px}
.seiten-fuss{margin-top:auto;font-size:11px;color:var(--muted);padding:0 8px}
#syncStatus{display:block;margin-bottom:4px}
.punkt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.punkt.gruen{background:var(--done)} .punkt.grau{background:#BFBFC7}
.punkt.rot{background:var(--danger)} .punkt.blau{background:var(--accent)}

/* ---------- Kopfbereich ---------- */
.kopf{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border);padding-bottom:16px}
.kopf h1{margin:0;font-size:26px;letter-spacing:-.3px}
.kopf .unter{color:var(--muted);font-size:14px;margin-top:3px}
.kopf-rechts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.abschnitt{margin:22px 0 8px;font-size:11.5px;font-weight:700;letter-spacing:.7px;color:var(--muted);text-transform:uppercase}
.abschnitt .zahl{margin-left:6px;font-weight:600;letter-spacing:0}
.abschnitt.rot{color:var(--danger)} .abschnitt.blau{color:var(--accent)} .abschnitt.gruen{color:var(--done)}
.leer{color:var(--muted);font-size:14px;padding:8px 2px}

/* ---------- Statistik ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.stat{background:var(--soft);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.blau b{color:var(--accent)} .stat.rot b{color:var(--danger)} .stat.gruen b{color:var(--done)}

/* ---------- Aufgabenkarte ---------- */
.karte{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;cursor:pointer;
}
.karte:active{background:#F5F7FC}
.karte-oben{display:flex;align-items:flex-start;gap:10px}
.status-knopf{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:2px solid #C8C8D0;background:#fff;
  padding:0;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.status-knopf.arbeit{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,#fff 50%)}
.status-knopf.fertig{border-color:var(--done);background:var(--done);color:#fff;font-size:13px;line-height:1}
.karte-titel{font-weight:700;font-size:15px;flex:1;min-width:0;word-break:break-word}
.karte.fertig .karte-titel{text-decoration:line-through;color:var(--muted);font-weight:600}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin:7px 0 0 32px;font-size:12.5px;color:var(--muted)}
.meta .ueberfaellig{color:var(--danger);font-weight:700}
.mod-punkt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.balken{height:6px;border-radius:3px;background:#ECECF0;margin:9px 0 0 32px;overflow:hidden;max-width:220px}
.balken i{display:block;height:100%;background:var(--accent)}
.balken.voll i{background:var(--done)}
.balken-text{font-size:11.5px;color:var(--muted);margin:4px 0 0 32px}
.unterliste{margin:6px 0 0 32px;font-size:13px}
.unterliste div{color:var(--text);padding:1px 0}
.unterliste div.ok{color:var(--muted);text-decoration:line-through}

/* ---------- Kalender ---------- */
.kal-leiste{display:flex;align-items:center;gap:6px;margin:18px 0 12px}
.kal-leiste h2{margin:0 8px;font-size:19px;min-width:190px}
.pfeil{border:1px solid var(--border);background:#fff;border-radius:8px;width:38px;height:38px;font-size:17px;line-height:1}
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.kal .wt{background:var(--soft);text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:7px 0}
.tag{background:#fff;min-height:92px;padding:5px 6px;text-align:left;border:0;display:block;width:100%;overflow:hidden}
.tag.fremd{background:var(--soft)} .tag.fremd .nr{color:#C2C2CA}
.tag.heute{background:var(--today)} .tag.heute .nr{color:var(--accent);font-weight:700}
.tag.gewaehlt{background:var(--sidebar-active);box-shadow:inset 0 0 0 2px var(--accent)}
.tag .nr{font-size:12.5px;font-weight:600}
.tag .anz{float:right;font-size:11px;color:var(--muted)}
.tag .eintrag{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tag .eintrag.ok{color:var(--muted);text-decoration:line-through}
.tag .mehr{font-size:10.5px;color:var(--muted);margin-top:2px}
.tagespanel{margin-top:18px;border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.tagespanel h3{margin:0 0 2px;font-size:17px}
.tagespanel .wt{color:var(--muted);font-size:13px}

/* ---------- Module ---------- */
.modul-gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:18px}
.modul-karte{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0;width:100%}
.modul-karte .strich{height:5px}
.modul-karte .inhalt{padding:14px 16px}
.modul-karte h3{margin:0;font-size:16px}
.modul-karte p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.modul-karte .warn{color:var(--danger);font-weight:700}
.zurueck{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:0 0 10px}

/* ---------- Filter ---------- */
.filter{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 10px}
.filter input,.filter select{
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;color:var(--text);
}
.filter input{flex:1;min-width:180px}

/* ---------- Einstellungen ---------- */
.box{border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
.box h3{margin:0 0 4px;font-size:16px}
.box p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.feld{margin-bottom:10px}
.feld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.feld input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;letter-spacing:1px}
.hinweis{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px}
.hinweis.ok{background:#EAF6EE;color:#276C3F} .hinweis.fehler{background:#FCECEC;color:#8E2427}

/* ---------- Dialog ---------- */
dialog{
  border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:90vh;
  box-shadow:0 20px 60px rgba(0,0,0,.22);color:var(--text);background:#fff;
}
dialog::backdrop{background:rgba(20,20,30,.4)}
.dlg-koerper{padding:20px;overflow-y:auto;max-height:calc(90vh - 76px);-webkit-overflow-scrolling:touch}
.dlg-fuss{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--border);align-items:center;
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.dlg-fuss .rechts{margin-left:auto;display:flex;gap:8px}
.zeile{display:flex;gap:12px;flex-wrap:wrap}
.zeile > .feld{flex:1;min-width:150px}
.feld select,.feld textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;background:#fff;color:var(--text)}
.feld textarea{min-height:70px;resize:vertical}
.schnell{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.unter-box{border:1px solid var(--border);border-radius:8px;background:var(--soft);padding:8px;min-height:60px}
.unter-zeile{display:flex;align-items:center;gap:8px;padding:4px 2px}
.unter-zeile input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;accent-color:var(--done)}
.unter-zeile span{flex:1;word-break:break-word}
.unter-zeile.ok span{text-decoration:line-through;color:var(--muted)}
.unter-zeile button{border:0;background:none;color:var(--muted);font-size:18px;padding:0 6px;line-height:1}
.unter-neu{display:flex;gap:6px;margin-top:8px}
.unter-neu input{flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 10px}

/* ---------- Tablet / iPad ---------- */
@media (max-width:880px){
  #app{flex-direction:column}
  #sidebar{
    width:100%;flex:0 0 auto;order:2;flex-direction:row;border-right:0;border-top:1px solid var(--border);
    position:fixed;bottom:0;left:0;right:0;padding:6px 8px;
    padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:30;
  }
  .marke,.marke-datum,.seiten-fuss,#neuBtnSeite{display:none}
  #nav{flex-direction:row;margin:0;width:100%;gap:0}
  .nav-item{flex-direction:column;gap:3px;font-size:11px;padding:7px 2px;text-align:center;border-radius:8px}
  .nav-item.aktiv{background:transparent}
  .nav-item svg{width:22px;height:22px;flex:0 0 22px}
  #content{order:1;padding-bottom:80px}
  .seite{padding:18px 16px 40px}
  .kopf h1{font-size:23px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tag{min-height:74px}
  .tag .eintrag{font-size:10px}
  #fabNeu{
    display:flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));
    width:56px;height:56px;border-radius:28px;background:var(--accent);color:#fff;border:0;
    align-items:center;justify-content:center;font-size:30px;line-height:1;z-index:31;
    box-shadow:0 6px 18px rgba(47,111,237,.4);
  }
  dialog{width:100vw;max-width:100vw;height:100%;max-height:100%;border-radius:0}
  .dlg-koerper{max-height:calc(100vh - 76px)}
}
#fabNeu{display:none}
/* ---------- Handy ---------- */
@media (max-width:560px){
  body{font-size:15.5px}
  .seite{padding:14px 12px 30px}
  .kopf{flex-wrap:wrap}
  .kopf h1{font-size:21px}
  .kopf-rechts [data-neu]{display:none}          /* dafür gibt es den runden Knopf unten rechts */
  .stats{gap:8px}
  .stat{padding:10px 12px} .stat b{font-size:21px} .stat span{font-size:11.5px}
  .kal .wt{font-size:10px;padding:5px 0}
  .tag{min-height:58px;padding:4px 3px}
  .tag .nr{font-size:12px}
  .tag .anz{display:none}
  .tag .eintrag{display:inline-block;margin:2px 1px 0 0}
  .tag .eintrag .txt{display:none}               /* nur noch farbige Punkte pro Aufgabe */
  .tag .eintrag .mod-punkt{margin:0;width:7px;height:7px}
  .tag .mehr{display:none}
  .kal-leiste h2{font-size:17px;min-width:0;flex:1;margin:0 4px}
  .karte{padding:11px 12px}
  .meta{margin-left:0;gap:8px}
  .balken,.balken-text,.unterliste{margin-left:0}
  .filter input{min-width:100%}
  .filter select{flex:1;min-width:46%}
  .modul-gitter{grid-template-columns:1fr 1fr;gap:10px}
  .modul-karte h3{font-size:15px}
}
@media (max-width:380px){ .modul-gitter{grid-template-columns:1fr} .stats{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="marke">SchulPlaner</div>
    <div class="marke-datum" id="kopfDatum"></div>
    <button class="btn btn-primary btn-block" id="neuBtnSeite" style="margin-top:14px">+ Neue Aufgabe</button>
    <nav id="nav"></nav>
    <div class="seiten-fuss">
      <span id="syncStatus"></span>
      <span id="zaehler"></span>
    </div>
  </aside>
  <main id="content"></main>
</div>
<button id="fabNeu" aria-label="Neue Aufgabe">+</button>

<dialog id="dlgAufgabe">
  <div class="dlg-koerper">
    <div class="feld">
      <label for="fTitel">Titel</label>
      <input id="fTitel" type="text" placeholder="z. B. Deutsch Aufsatz schreiben">
    </div>
    <div class="zeile">
      <div class="feld"><label for="fModul">Modul</label><select id="fModul"></select></div>
      <div class="feld"><label for="fPrio">Priorität</label><select id="fPrio"></select></div>
    </div>
    <div class="zeile">
      <div class="feld"><label for="fStatus">Fortschritt / Status</label><select id="fStatus"></select></div>
      <div class="feld">
        <label for="fDatum">Deadline</label>
        <input id="fDatum" type="date">
        <div class="schnell">
          <button class="btn btn-klein" data-tage="0">Heute</button>
          <button class="btn btn-klein" data-tage="1">Morgen</button>
          <button class="btn btn-klein" data-tage="3">+3 Tage</button>
          <button class="btn btn-klein" data-tage="7">+1 Woche</button>
          <button class="btn btn-klein" data-tage="">Kein Datum</button>
        </div>
      </div>
    </div>
    <div class="feld">
      <label>Unteraufgaben</label>
      <div class="unter-box" id="fUnter"></div>
      <div class="unter-neu">
        <input id="fUnterNeu" type="text" placeholder="Unteraufgabe hinzufügen">
        <button class="btn btn-klein" id="fUnterAdd">+ Hinzufügen</button>
      </div>
    </div>
    <div class="feld"><label for="fNotiz">Notizen</label><textarea id="fNotiz"></textarea></div>
  </div>
  <div class="dlg-fuss">
    <button class="btn btn-danger" id="fLoeschen">Löschen</button>
    <div class="rechts">
      <button class="btn" id="fAbbrechen">Abbrechen</button>
      <button class="btn btn-primary" id="fSpeichern">Speichern</button>
    </div>
  </div>
</dialog>

<dialog id="dlgModul">
  <div class="dlg-koerper">
    <div class="feld"><label for="mName">Name des Moduls</label><input id="mName" type="text" placeholder="z. B. Geschichte"></div>
    <div class="feld"><label>Farbe</label><div id="mFarben" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
  </div>
  <div class="dlg-fuss">
    <button class="btn btn-danger" id="mLoeschen">Löschen</button>
    <div class="rechts">
      <button class="btn" id="mAbbrechen">Abbrechen</button>
      <button class="btn btn-primary" id="mSpeichern">Speichern</button>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
